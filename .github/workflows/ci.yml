name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lukka/get-cmake@latest
      - name: Build
        run: cmake --build build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lukka/get-cmake@latest
      - name: Build
        run: cmake --build build
      - name: Run benchmarks
        run: build/WebServer
