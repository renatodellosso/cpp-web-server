name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: CMAKE_PREFIX_PATH=packages cmake -S . -B build
      - name: Build
        run: cmake --build build

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: CMAKE_PREFIX_PATH=packages cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Run benchmarks
        run: build/WebServer
